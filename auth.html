<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | TaskMaster</title>
    <link rel="stylesheet" href="/styles/global.css">
    <link rel="stylesheet" href="/styles/auth.css">

    <script src="/scripts/main.js"></script>
    <script>
        redirectIfLoggedIn();
    </script>
</head>
<body>
    <!-- auth page container -->
    <div data-modifier="auth-page"></div>
    <!-- validator library -->
    <script src="https://cdn.jsdelivr.net/npm/validator@13.11.0/validator.min.js"></script>
    <!-- component loader -->
    <script src="/scripts/loadComponent.js"></script>
    <!-- auth logic -->
    <script src="/scripts/auth.js"></script>
    <script>
        // load background
        loadComponent("auth-page", "/templates/auth/auth-bg.html");
        // load form template then initialize auth logic + validation
        loadComponent("auth-page", "/templates/auth/auth-form.html", () => {
            setAuthLogic();    // from auth.js
            formValidation();  // from auth.js
        });
    </script>
</body>
</html>
