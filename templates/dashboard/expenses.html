<link rel="stylesheet" href="/styles/dashboard/tasks.css">
<link rel="stylesheet" href="/styles/dashboard/community.css">
<link rel="stylesheet" href="/styles/dashboard/expenses.css">

<div class="expenses-container">
    <div class="expenses-container__heading">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
            class="lucide lucide-dollar-sign-icon lucide-dollar-sign">
            <line x1="12" x2="12" y1="2" y2="22" />
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
        </svg>
        <div class="expenses-container__heading--title">
            <h1>Expense Tracker</h1>
            <p>Monitor your spending</p>
        </div>
    </div>

    <div class="expenses-container__main">
        <div class="expenses-container__main--top">
            <button class="container-btn active" data-tab="tasks">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-dollar-sign-icon lucide-dollar-sign">
                    <line x1="12" x2="12" y1="2" y2="22" />
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                </svg>
                <h4>My Expenses</h4>
            </button>
            <button class="container-btn" data-tab="summary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-chart-column-icon lucide-chart-column">
                    <path d="M3 3v16a2 2 0 0 0 2 2h16" />
                    <path d="M18 17V9" />
                    <path d="M13 17V5" />
                    <path d="M8 17v-3" />
                </svg>
                <h4>AI Summary</h4>
            </button>
        </div>

        <div class="expenses-container__main--mid">
            <div class="expenses-container__cards">
                <div class="expense-card">
                    <div class="expense-card__title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-dollar-sign-icon lucide-dollar-sign">
                            <line x1="12" x2="12" y1="2" y2="22" />
                            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
                        </svg>
                        <h5>Total Expenses</h5>
                    </div>
                    <div class="expense-card__details">
                        <h2>$0.00</h2>
                        <h6>0 transactions</h6>
                    </div>
                </div>
                <div class="expense-card">
                    <div class="expense-card__title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-trending-up h-4 w-4">
                            <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
                            <polyline points="16 7 22 7 22 13"></polyline>
                        </svg>
                        <h5>Top Category</h5>
                    </div>
                    <div class="expense-card__details">
                        <h2>N/A</h2>
                        <h6>$0.00</h6>
                    </div>
                </div>
                <div class="expense-card">
                    <div class="expense-card__title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-trending-down h-4 w-4">
                            <polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline>
                            <polyline points="16 17 22 17 22 11"></polyline>
                        </svg>
                        <h5>Average</h5>
                    </div>
                    <div class="expense-card__details">
                        <h2>$0.00</h2>
                        <h6>per transaction</h6>
                    </div>
                </div>
            </div>

            <div class="expenses-container__recent">
                <div class="expenses-container__recent--top">
                    <h3>Recent Expenses</h3>
                    <button class="expense-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="lucide lucide-plus h-4 w-4 mr-2">
                            <path d="M5 12h14"></path>
                            <path d="M12 5v14"></path>
                        </svg>
                        Add Expense
                    </button>
                </div>
                <div class="expenses-container__recent--box">
                    <p>No expenses recorded yet. Start tracking your spending!</p>
                </div>
            </div>
        </div>
    </div>
</div>
